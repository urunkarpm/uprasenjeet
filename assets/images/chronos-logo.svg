<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background & Glowing Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Canvas Background Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGlow)" stroke="url(#ringGrad)" stroke-width="3" filter="url(#softShadow)"/>

  <!-- Globe Latitude & Longitude Lines (Timezone Grid) -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" fill="none">
    <!-- Outer Globe Rim -->
    <circle cx="256" cy="256" r="180" stroke="url(#cyanGrad)" stroke-opacity="0.5" stroke-width="2.5"/>
    
    <!-- Latitudes -->
    <ellipse cx="256" cy="256" rx="180" ry="60"/>
    <ellipse cx="256" cy="256" rx="180" ry="120"/>
    <line x1="76" y1="256" x2="436" y2="256"/>

    <!-- Longitudes -->
    <ellipse cx="256" cy="256" rx="60" ry="180"/>
    <ellipse cx="256" cy="256" rx="120" ry="180"/>
    <line x1="256" y1="76" x2="256" y2="436"/>
  </g>

  <!-- Chronograph Outer Ring & Hour Ticks -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 8"/>
  
  <!-- Major Hour Ticks (12, 3, 6, 9) -->
  <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="44" x2="256" y2="58"/>
    <line x1="468" y1="256" x2="454" y2="256"/>
    <line x1="256" y1="468" x2="256" y2="454"/>
    <line x1="44" y1="256" x2="58" y2="256"/>
  </g>

  <!-- Timezone Marker Nodes (Pings on World Map) -->
  <g filter="url(#neonGlow)">
    <!-- Tokyo / Asia -->
    <circle cx="370" cy="180" r="7" fill="#fbbf24"/>
    <circle cx="370" cy="180" r="14" fill="none" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- London / Europe -->
    <circle cx="235" cy="155" r="7" fill="#38bdf8"/>
    <circle cx="235" cy="155" r="14" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- New York / Americas -->
    <circle cx="150" cy="190" r="7" fill="#818cf8"/>
    <circle cx="150" cy="190" r="14" fill="none" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Sydney / Oceania -->
    <circle cx="390" cy="330" r="6" fill="#34d399"/>
    <circle cx="390" cy="330" r="12" fill="none" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>

  <!-- Connecting Timezone Flight/Data Arcs -->
  <path d="M 150 190 Q 192 140 235 155" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  <path d="M 235 155 Q 300 130 370 180" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.7"/>
  <path d="M 370 180 Q 400 250 390 330" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <!-- Clock Hands (Chronos Pointer) -->
  <g stroke-linecap="round" filter="url(#neonGlow)">
    <!-- Hour Hand -->
    <line x1="256" y1="256" x2="190" y2="200" stroke="url(#goldGrad)" stroke-width="7"/>
    <!-- Minute Hand -->
    <line x1="256" y1="256" x2="330" y2="135" stroke="#38bdf8" stroke-width="5"/>
    <!-- Second Hand (Precision Arc) -->
    <line x1="256" y1="256" x2="256" y2="105" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="256" cy="105" r="4" fill="#ef4444"/>
    <!-- Center Pivot Cap -->
    <circle cx="256" cy="256" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="256" cy="256" r="4" fill="#0f172a"/>
  </g>

  <!-- Digital Time Badge Mockup at Bottom -->
  <g transform="translate(166, 375)">
    <rect width="180" height="42" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="url(#ringGrad)" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="90" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
      12:45:08 <tspan fill="#fbbf24" font-size="12">UTC</tspan>
    </text>
  </g>
</svg>
