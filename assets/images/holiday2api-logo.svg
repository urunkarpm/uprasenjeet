<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="calBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Glow -->
  <circle cx="256" cy="256" r="210" fill="#38BDF8" opacity="0.06" filter="url(#glow)"/>

  <!-- Calendar Container Frame -->
  <rect x="76" y="80" width="360" height="352" rx="32" fill="url(#calBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" />

  <!-- Calendar Header Band -->
  <path d="M76 112 C76 94.327 90.327 80 108 80 H404 C421.673 80 436 94.327 436 112 V156 H76 Z" fill="url(#headerGrad)" />

  <!-- Binder Rings -->
  <rect x="144" y="60" width="24" height="42" rx="12" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" />
  <rect x="344" y="60" width="24" height="42" rx="12" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" />

  <!-- Calendar Grid Mock Lines -->
  <!-- Row 1 -->
  <circle cx="140" cy="210" r="14" fill="#334155" />
  <circle cx="198" cy="210" r="14" fill="#334155" />
  <circle cx="256" cy="210" r="14" fill="#FF9933" filter="url(#glow)" />
  <circle cx="314" cy="210" r="14" fill="#334155" />
  <circle cx="372" cy="210" r="14" fill="#334155" />

  <!-- Row 2 -->
  <circle cx="140" cy="268" r="14" fill="#334155" />
  <circle cx="198" cy="268" r="14" fill="#334155" />
  <circle cx="256" cy="268" r="14" fill="#334155" />
  <circle cx="314" cy="268" r="14" fill="#10B981" filter="url(#glow)" />
  <circle cx="372" cy="268" r="14" fill="#334155" />

  <!-- API Gateway / JSON Edge Badge Overlay -->
  <g transform="translate(116, 318)">
    <rect width="280" height="84" rx="18" fill="#030712" stroke="#38BDF8" stroke-width="2" opacity="0.95" />
    <!-- API / JSON Code Indicator -->
    <text x="32" y="52" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="bold">{</text>
    <text x="56" y="50" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">API: <tspan fill="#34D399">200 OK</tspan></text>
    <text x="246" y="52" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="bold">}</text>
    
    <!-- Fast Edge Indicator -->
    <path d="M208 26 L194 44 H204 L200 60 L216 38 H206 Z" fill="#F59E0B" filter="url(#glow)" />
  </g>
</svg>
